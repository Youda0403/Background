<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pairtone — 우리 둘 배경화면 메이커</title>
<meta name="description" content="최애 커플 이름으로 만드는 감성 배경화면. 폰·패드·데스크탑 사이즈 프리셋, 사진 필터, 일코 가능한 디자인까지.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Fraunces:ital,wght@0,100..900;1,100..900&family=Pinyon+Script&family=Italianno&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Archivo:ital,wght@0,100..900;1,100..900&family=Syne:wght@400..800&family=Anton&family=Unbounded:wght@200..900&family=Bagel+Fat+One&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='24'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark">✦</span>
    <span class="wordmark">pairtone</span>
    <span class="tagline">우리 둘 배경화면 메이커</span>
  </div>
  <div class="topActions">
    <button type="button" class="btn ghost" id="btnRandom" title="완전히 새로운 무드 뽑기">랜덤 뽑기</button>
    <button type="button" class="btn ghost" id="btnCopyLink" title="이 배경화면을 그대로 복원하는 링크 복사">링크 복사</button>
    <button type="button" class="btn primary" id="btnDownload">PNG 저장</button>
  </div>
</header>

<main class="shell">

  <section class="stage" aria-label="미리보기">
    <div class="stageInner">
      <div class="deviceWrap" id="deviceWrap">
        <canvas id="preview" width="600" height="1300" aria-label="배경화면 미리보기"></canvas>
        <div class="dropHint" id="dropHint" hidden>여기에 사진을 놓아주세요</div>
      </div>
      <div class="stageMeta">
        <span id="sizeLabel">—</span>
        <span class="dot">·</span>
        <span id="tierLabel">—</span>
        <span class="dot">·</span>
        <label class="inlineCheck"><input type="checkbox" id="guideToggle"> 잠금화면 가이드</label>
      </div>
      <p class="stageTip" id="stageTip">프리뷰를 드래그하면 사진 위치를 옮길 수 있어요.</p>
    </div>
  </section>

  <section class="panel" aria-label="설정">
    <div id="panelRoot"></div>
    <footer class="panelFoot">
      <p>사진은 브라우저 안에서만 처리되고 어디에도 업로드되지 않아요.</p>
    </footer>
  </section>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/presets.js"></script>
<script src="js/palettes.js"></script>
<script src="js/primitives.js"></script>
<script src="js/type.js"></script>
<script src="js/frames.js"></script>
<script src="js/photo.js"></script>
<script src="js/textstack.js"></script>
<script src="js/deco.js"></script>
<script src="js/compose.js"></script>
<script src="js/poster.js"></script>
<script src="js/layouts/editorial.js"></script>
<script src="js/layouts/lyric.js"></script>
<script src="js/layouts/grid.js"></script>
<script src="js/layouts/zine.js"></script>
<script src="js/layouts/aura.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/controls.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
